name: Update snapshot daily

on:
  schedule:
    # 每天 00:00 (Asia/Shanghai) = 16:00 UTC
    - cron: "0 16 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: update-snapshot
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Update snapshot data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SNAP_TZ: Asia/Shanghai
        run: node update-snapshot.mjs

      - name: Commit and push changes
        id: commit
        env:
          GIT_AUTHOR_NAME: lingyicute
          GIT_AUTHOR_EMAIL: lingyicute@users.noreply.github.com
          GIT_COMMITTER_NAME: lingyicute
          GIT_COMMITTER_EMAIL: lingyicute@users.noreply.github.com
        run: |
          git config user.name "lingyicute"
          git config user.email "lingyicute@users.noreply.github.com"
          if git diff --quiet -- index.html; then
            echo "No snapshot changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          DATE=$(TZ=Asia/Shanghai date +%F)
          git add index.html
          git commit -m "chore: update snapshot database ($DATE)"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # 由 GITHUB_TOKEN 推送的提交不会触发其它工作流的 push 事件，
      # 因此显式触发 Pages 部署（workflow_dispatch 不受此限制）。
      - name: Trigger Pages deployment
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run static.yml --ref main
