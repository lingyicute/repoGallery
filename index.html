function s2lin(c) { c /= 255; return c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); }
function lin2s(c) { c = clamp(c, 0, 1); return c <= 0.0031308 ? c * 12.92 : 1.055 * Math.pow(c, 1 / 2.4) - 0.055; }
function rgbToOklch(r, g, b) {

  const l = Math.cbrt(0.4122214708 * r + 0.5363325363 * g + 0.0514459929 * b);
  const m = Math.cbrt(0.2119034982 * r + 0.6806995451 * g + 0.1073969566 * b);
  const s = Math.cbrt(0.0883024619 * r + 0.2817188376 * g + 0.6299787005 * b);
  const L = 0.2104542553 * l + 0.793617785 * m - 0.0040720468 * s;
  const a = 1.9779984951 * l - 2.428592205 * m + 0.4505937099 * s;
  const bb = 0.0259040371 * l + 0.7827717662 * m - 0.808675766 * s;
  return [L, Math.hypot(a, bb), ((Math.atan2(bb, a) * 180) / Math.PI + 360) % 360];
}

  const hr = (h * Math.PI) / 180;
  const a = C * Math.cos(hr), bb = C * Math.sin(hr);
  const l = Math.pow(L + 0.3963377774 * a + 0.2158037573 * bb, 3);
  const m = Math.pow(L - 0.1055613458 * a - 0.0638541728 * bb, 3);
  const s = Math.pow(L - 0.0894841775 * a - 1.291485548 * bb, 3);
  return [
    lin2s(4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s) * 255,
    lin2s(-1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s) * 255,
    lin2s(-0.0041960863 * l - 0.7034186147 * m + 1.707614701 * s) * 255

}

function hexToOklch(h) { return rgbToOklch.apply(null, hexToRgb(h)); }

function tone(pal, t) {

/* 「壁纸取色」同款思路:量化头像像素,按彩度加权取主导色 */
function seedFromImage(url) {
  return new Promise(res => {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => {
      try {
        const s = 48, cv = document.createElement('canvas');
        cv.width = cv.height = s;
        const cx = cv.getContext('2d', { willReadFrequently: true });
        cx.drawImage(img, 0, 0, s, s);
        const d = cx.getImageData(0, 0, s, s).data;
        const BINS = 24, bins = [];
        for (let i = 0; i < BINS; i++) bins.push({ w: 0, a: 0, b: 0 });
        for (let i = 0; i < d.length; i += 4) {
          if (d[i + 3] < 200) continue;
          const o = rgbToOklch(d[i], d[i + 1], d[i + 2]), L = o[0], C = o[1], h = o[2];
          if (C < 0.02 || L < 0.08 || L > 0.97) continue;
          const w = C * (L > 0.3 && L < 0.85 ? 1 : 0.4);
          const bi = Math.floor((h / 360) * BINS) % BINS, hr = (h * Math.PI) / 180;
          bins[bi].w += w; bins[bi].a += Math.cos(hr) * C * w; bins[bi].b += Math.sin(hr) * C * w;
        }
        let best = bins[0];
        for (let i = 1; i < BINS; i++) if (bins[i].w > best.w) best = bins[i];
        if (best.w <= 0) { res(null); return; }
        const a = best.a / best.w, bb = best.b / best.w;
        const C = clamp(Math.hypot(a, bb) * 1.25, 0.07, 0.17);
        const h = ((Math.atan2(bb, a) * 180) / Math.PI + 360) % 360;
        res(oklchToHex(0.62, C, h));
      } catch (e) { res(null); }
    };
    img.onerror = () => res(null);
    img.src = url;
  });
}

/* ================================================================
   5 · 数据管道:GitHub API → ungh 镜像 → 本地快照
================================================================ */
const GH = 'https://api.github.com', UNGH = 'https://ungh.cc', WHO = 'lingyicute';
async function fetchJSON(url, timeout) {
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), timeout || 9000);
  try {
    const r = await fetch(url, { signal: ctrl.signal, headers: { Accept: 'application/vnd.github+json' } });
    if (!r.ok) throw new Error(r.status);
    return await r.json();
  } finally { clearTimeout(t); }
}
function normGh(r) {
  return { id: r.id, name: r.name, full_name: r.full_name, html_url: r.html_url, description: r.description,
    fork: !!r.fork, archived: !!r.archived, language: r.language || null, stars: r.stargazers_count || 0,
    forks: r.forks_count || 0, topics: r.topics || [], created_at: r.created_at, pushed_at: r.pushed_at,
    homepage: r.homepage || null, license: r.license ? r.license.spdx_id : null };
}
function normMirror(r) {
  return { id: r.id, name: r.name, full_name: r.repo, html_url: 'https://github.com/' + r.repo, description: r.description,
    fork: false, archived: false, language: null, stars: r.stars || 0, forks: r.forks || 0, topics: [],
    created_at: r.createdAt, pushed_at: r.pushedAt, homepage: null, license: null };
}
async function loadData() {
  try {
    const user = await fetchJSON(GH + '/users/' + WHO);
    const repos = [];
    for (let p = 1; p <= 3; p++) {
      const chunk = await fetchJSON(GH + '/users/' + WHO + '/repos?per_page=100&sort=updated&page=' + p);
      repos.push.apply(repos, chunk);
      if (chunk.length < 100) break;
    }
    if (!repos.length) throw 0;
    return { user: user, repos: repos.map(normGh), source: 'live' };
  } catch (e) {
    try {
      const d = await fetchJSON(UNGH + '/users/' + WHO + '/repos');
      if (!d.repos || !d.repos.length) throw 0;
      return { user: Object.assign({}, USER, { public_repos: d.repos.length }), repos: d.repos.map(normMirror), source: 'mirror' };
    } catch (e2) {
      return { user: USER, repos: SNAP.map(snapRepo), source: 'snapshot' };
    }
  }
}

const LS_DARK = 'lingyi.m3.dark', LS_SEED = 'lingyi.m3.seed';
function readLS(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function writeLS(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
const DEFAULT_SEED = '#6750A4';
const SEED_PRESETS = [
  ['幻梦紫', '#6750A4'], ['晴空蓝', '#0B57D0'], ['湖水青', '#006A6A'],
  ['抹茶绿', '#3E6837'], ['樱花粉', '#984061'], ['蜜柑橙', '#855318']
];

let dark = (() => { const v = readLS(LS_DARK); if (v !== null) return v === '1'; return matchMedia('(prefers-color-scheme: dark)').matches; })();
let seed = readLS(LS_SEED) || DEFAULT_SEED;
let animTimer = 0;
function applyThemeAnim(animate) {
  if (animate && !REDUCED) {
    document.documentElement.classList.add('theme-anim');
    applyTheme(seed, dark);
    clearTimeout(animTimer);
    animTimer = setTimeout(() => document.documentElement.classList.remove('theme-anim'), 240);
  } else {
    applyTheme(seed, dark);
  }
}
function persistTheme() { writeLS(LS_DARK, dark ? '1' : '0'); writeLS(LS_SEED, seed); }
/* 首帧前应用主题,杜绝闪烁 */
applyTheme(seed, dark);

/* ================================================================
   7 · 揭示系统(共享 IntersectionObserver)与计数器
================================================================ */
const io = new IntersectionObserver(entries => {
  for (const e of entries) if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); }
}, { threshold: 0.05, rootMargin: '0px 0px -4% 0px' });
function attachReveals(root) {
  $$('.rv:not(.in), .rv-lite:not(.in), .donut:not(.in), .count:not(.done)', root).forEach(el => io.observe(el));
}
/* 工具栏是静态骨架，不会经过动态渲染；启动时也要注册揭示观察器 */
attachReveals(document);
const countIO = new IntersectionObserver(entries => {
  for (const e of entries) {
    if (!e.isIntersecting) continue;
    countIO.unobserve(e.target);
    const el = e.target, to = +el.dataset.to || 0;
    el.classList.add('done');
    if (REDUCED || !to) { el.textContent = to.toLocaleString('en-US'); continue; }
    const t0 = performance.now(), dur = 950;
    const tick = t => {
      const p = Math.min(1, (t - t0) / dur), ease = 1 - Math.pow(1 - p, 4);
      el.textContent = Math.round(to * ease).toLocaleString('en-US');
      if (p < 1) requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  }
}, { threshold: 0.3 });
function attachCounts(root) { $$('.count', root).forEach(el => countIO.observe(el)); }

   8 · 全局状态
================================================================ */
let DATA = null, STATS = null;
let query = '', sortKey = 'pushed', typeKey = 'all', langKey = null;
let extracting = false, panelOpen = false;

/* Snackbar */
let snackTimer = 0, snackOut = 0;
function toast(msg) {
  const host = $('#snackHost');
  host.innerHTML = '<div class="snack inv m3-shadow-2" role="status">' + ic('check', 16) + '<span>' + esc(msg) + '</span></div>';
  clearTimeout(snackTimer); clearTimeout(snackOut);
  snackTimer = setTimeout(() => {
    const el = host.firstElementChild;
    if (el) el.classList.add('out');
    snackOut = setTimeout(() => { host.innerHTML = ''; }, 190);
  }, 2100);
}

/* ================================================================
   9 · 渲染
================================================================ */
function computeStats() {
  let stars = 0, forks = 0, forksN = 0;
  const map = new Map();
  for (const r of DATA.repos) {
    stars += r.stars; forks += r.forks;
    if (r.fork) forksN++;
    if (r.language) map.set(r.language, (map.get(r.language) || 0) + 1);
  }
  const langs = Array.from(map, ([name, count]) => ({ name: name, count: count, color: langColor(name) }))
    .sort((a, b) => b.count - a.count);
  STATS = { stars: stars, forks: forks, forksN: forksN, langs: langs };
}

function filtered() {
  const q = query.trim().toLowerCase();
  let list = DATA.repos.filter(r => {
    if (typeKey === 'source' && r.fork) return false;
    if (typeKey === 'fork' && !r.fork) return false;
    if (langKey && r.language !== langKey) return false;
    if (q) {
      const hay = (r.name + ' ' + (r.description || '') + ' ' + r.topics.join(' ')).toLowerCase();
      if (hay.indexOf(q) < 0) return false;
    }
    return true;
  });
  list = list.slice();
  if (sortKey === 'stars') list.sort((a, b) => b.stars - a.stars);
  else if (sortKey === 'created') list.sort((a, b) => +new Date(b.created_at) - +new Date(a.created_at));
  else if (sortKey === 'name') list.sort((a, b) => a.name.localeCompare(b.name));
  else list.sort((a, b) => +new Date(b.pushed_at) - +new Date(a.pushed_at));
  return list;
}

function maskText(text, base) {
  let out = '';
  for (let i = 0; i < text.length; i++) {
    const ch = text[i] === ' ' ? '&nbsp;' : esc(text[i]);
    out += '<span class="ch" style="--d:' + (base + i * 34) + 'ms" aria-hidden="true">' + ch + '</span>';
  }
  return '<span class="rv-mask" aria-label="' + esc(text) + '">' + out + '</span>';
}

function donutHTML(langs) {
  const total = langs.reduce((s, l) => s + l.count, 0) || 1;
  const segs = langs.slice(0, 5);
  const rest = langs.slice(5).reduce((s, l) => s + l.count, 0);
  if (rest > 0) segs.push({ name: '其他', count: rest, color: 'var(--md-outline-variant)' });
  const C = 2 * Math.PI * 52;
  let acc = 0, circles = '', legend = '';
  segs.forEach((s, i) => {
    const frac = s.count / total, off = acc; acc += frac;
    const len = Math.max(frac * C - 2.5, 1.5);
    circles += '<circle class="seg-circle" cx="66" cy="66" r="52" fill="none" stroke="' + s.color +
      '" stroke-width="15" stroke-dasharray="' + len.toFixed(1) + ' ' + C.toFixed(1) +
      '" transform="rotate(' + (off * 360 - 90).toFixed(1) + ' 66 66)" style="--off:' + len.toFixed(1) + ';--d:' + (300 + i * 90) + 'ms"/>';
    if (i < 5) {
      const pct = Math.round(frac * 100);
      legend += '<li><span class="dot" style="background:' + s.color + '"></span><span class="name">' + esc(s.name) +
        '</span><span class="bar-track"><span class="bar-fill" style="background:' + s.color + ';--w:' + pct + '%;--d:' + (380 + i * 80) + 'ms"></span></span><span class="pct mono">' + pct + '%</span></li>';
    }
  });
  return '<div class="donut-card donut c-high rv-lite" style="--d:820ms">' +
    '<div class="donut-head">' + ic('code', 16) + ' 语言构成 <em>' + langs.length + ' 种</em></div>' +
    '<div class="donut-body"><div class="donut-fig"><svg viewBox="0 0 132 132">' + circles + '</svg>' +
    '<div class="donut-center"><b>' + langs.length + '</b><span>种语言</span></div></div>' +
    '<ul class="legend">' + legend + '</ul></div></div>';
}

/* 复制 */
function copyText(t) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(t).catch(() => fallbackCopy(t));
  } else fallbackCopy(t);
}
function fallbackCopy(t) {
  const ta = document.createElement('textarea');
  ta.value = t; document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); } catch (e) {}
  ta.remove();
}

onScroll();
/* 字体就绪后重新测量分段指示器宽度 */
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => requestAnimationFrame(placePills));

/* ================================================================
   11 · 启动与首屏加载
================================================================ */
function whenWindowLoaded() {
  if (document.readyState === 'complete') return Promise.resolve();
  return new Promise(resolve => addEventListener('load', resolve, { once: true }));
}
function whenFontsReady() {
  return document.fonts && document.fonts.ready ? document.fonts.ready.catch(() => {}) : Promise.resolve();
}
function whenImagesReady(root) {
  const images = $$('img', root);
  return Promise.all(images.map(img => {
    if (img.complete) return img.decode ? img.decode().catch(() => {}) : Promise.resolve();
    return new Promise(resolve => {
      const done = () => resolve();
      img.addEventListener('load', done, { once: true });
      img.addEventListener('error', done, { once: true });
    });
  }));
}
function releasePageLoader() {
  const loader = $('#pageLoader');
  document.body.classList.remove('page-loading');
  document.body.removeAttribute('aria-busy');
  if (!loader) return;
  loader.classList.add('is-ready');
  loader.setAttribute('aria-hidden', 'true');
  setTimeout(() => loader.remove(), 420);
}

async function bootPage() {
  let d;
  try {
    [d] = await Promise.all([loadData(), whenWindowLoaded(), whenFontsReady()]);
  } catch (e) {
    /* 数据管道本身有兜底；这里再保留一层保护，避免加载层卡住 */
    console.error('页面初始化失败,使用本地快照', e);
    d = { user: USER, repos: SNAP.map(snapRepo), source: 'snapshot' };
  }

  DATA = d;
  computeStats();
  renderAll();

  /* Material You 时刻:首次访问从头像取色(已有记忆偏好则跳过) */
  const autoSeed = !readLS(LS_SEED)
    ? seedFromImage(d.user.avatar_url).then(c => {
        if (c && !readLS(LS_SEED)) { seed = c; applyThemeAnim(true); }
      })
    : Promise.resolve();

  /* 动态渲染出的头像也要完成解码，确保放行时不再出现半成品 */
  await Promise.all([whenFontsReady(), whenImagesReady(document), autoSeed]);
  await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
  releasePageLoader();
}
bootPage();
</script>
